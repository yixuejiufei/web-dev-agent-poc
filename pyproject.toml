[project]
name = "web-dev-agent-poc"
version = "0.1.0"
description = "Phase 1 POC: single development agent for web pages"
requires-python = ">=3.11"
dependencies = [
    "yineng-factory>=0.3.15",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
